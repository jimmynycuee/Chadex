[package]
name = "webcodex-lsp"
version.workspace = true
license.workspace = true
edition.workspace = true
publish = false

[features]
default = []
real-process-tests = []

[dependencies]
webcodex-core = { path = "../webcodex-core" }
webcodex-process = { path = "../webcodex-process" }
webcodex-runner-config = { path = "../webcodex-runner-config" }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
url = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }
