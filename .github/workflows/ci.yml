name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-history:
    name: Public history / secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.29.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSL "$url" -o "/tmp/$archive"
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  /tmp/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "/tmp/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"

      - name: Scan public history
        env:
          CHADEX_REQUIRE_GITLEAKS: "1"
        run: ./scripts/public_release_check.sh HEAD

  source-gate:
    name: Source release gate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Rust
        run: ./scripts/bootstrap_rust.sh

      - name: Run source gate
        env:
          CHADEX_RELEASE_CHECK_BUILD_APP: "0"
        run: ./scripts/release_check.sh

  windows-core:
    name: Windows core gate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-NativeChecked {
            param([string]$FilePath, [string[]]$Arguments)
            $null = Get-Command -Name $FilePath -CommandType Application -ErrorAction Stop
            $previousErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              & $FilePath @Arguments
              $nativeExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            if ($null -eq $nativeExitCode) {
              throw "Native command '$FilePath' did not return an exit code."
            }
            if ($nativeExitCode -ne 0) {
              throw "Native command '$FilePath' exited with code $nativeExitCode."
            }
          }
          Invoke-NativeChecked -FilePath "rustup" -Arguments @("toolchain", "install", "1.98.1", "--profile", "minimal")
          Invoke-NativeChecked -FilePath "rustup" -Arguments @("default", "1.98.1")

      - name: Run Windows core gate
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          $targetDir = Join-Path $env:GITHUB_WORKSPACE "runtime-engine/target"
          $env:CARGO_TARGET_DIR = $targetDir
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "CARGO_TARGET_DIR=$targetDir" -Encoding utf8NoBOM
          $pwshPath = (Get-Command -Name "pwsh.exe" -CommandType Application -ErrorAction Stop).Source
          $env:WEBCODEX_TEST_PWSH = $pwshPath
          .\scripts\windows_core_check.ps1

      - name: Run Windows runtime E2E
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-NativeChecked {
            param([string]$FilePath, [string[]]$Arguments)
            $null = Get-Command -Name $FilePath -CommandType Application -ErrorAction Stop
            $previousErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              & $FilePath @Arguments
              $nativeExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            if ($null -eq $nativeExitCode) {
              throw "Native command '$FilePath' did not return an exit code."
            }
            if ($nativeExitCode -ne 0) {
              throw "Native command '$FilePath' exited with code $nativeExitCode."
            }
          }
          $outputPath = Join-Path $env:RUNNER_TEMP "windows-runtime-e2e.json"
          Invoke-NativeChecked -FilePath "python" -Arguments @("scripts/windows_runtime_e2e.py", "--output", $outputPath)

      - name: Upload Windows runtime E2E result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runtime-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-runtime-e2e.json
          if-no-files-found: warn
          retention-days: 7

      - name: Install pinned Node.js for Windows desktop
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Run Windows desktop W3 gates
        shell: pwsh
        env:
          CARGO_INCREMENTAL: "0"
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          function Invoke-NativeChecked {
            param([string]$FilePath, [string[]]$Arguments)
            $null = Get-Command -Name $FilePath -CommandType Application -ErrorAction Stop
            $previousErrorActionPreference = $ErrorActionPreference
            try {
              $ErrorActionPreference = "Continue"
              & $FilePath @Arguments
              $nativeExitCode = $LASTEXITCODE
            } finally {
              $ErrorActionPreference = $previousErrorActionPreference
            }
            if ($null -eq $nativeExitCode) {
              throw "Native command '$FilePath' did not return an exit code."
            }
            if ($nativeExitCode -ne 0) {
              throw "Native command '$FilePath' exited with code $nativeExitCode."
            }
          }

          Push-Location (Join-Path $env:GITHUB_WORKSPACE "apps/windows")
          try {
            Invoke-NativeChecked -FilePath "npm.cmd" -Arguments @("ci")
            Invoke-NativeChecked -FilePath "npm.cmd" -Arguments @("run", "typecheck")
            Invoke-NativeChecked -FilePath "npm.cmd" -Arguments @("test")
            Invoke-NativeChecked -FilePath "npm.cmd" -Arguments @("run", "build")
          } finally {
            Pop-Location
          }

          Invoke-NativeChecked -FilePath "python" -Arguments @("scripts/test_windows_desktop_smoke.py")
          Invoke-NativeChecked -FilePath "cargo" -Arguments @(
            "test", "--locked", "--manifest-path", "apps/windows/bridge/Cargo.toml",
            "--features", "test-helper"
          )

          $targetDir = $env:CARGO_TARGET_DIR
          if ([string]::IsNullOrWhiteSpace($targetDir)) {
            throw "CARGO_TARGET_DIR was not set by the Windows core gate."
          }
          Invoke-NativeChecked -FilePath "python" -Arguments @(
            "scripts/prepare_windows_desktop.py", "--target-dir", $targetDir,
            "--desktop-output", (Join-Path $targetDir "debug")
          )

          $tauriManifest = "apps/windows/src-tauri/Cargo.toml"
          Invoke-NativeChecked -FilePath "cargo" -Arguments @(
            "build", "--locked", "--manifest-path", $tauriManifest,
            "--features", "custom-protocol"
          )
          # Preserve the application without fixture IPC before the smoke build.
          $productionDir = Join-Path $env:RUNNER_TEMP "windows-desktop-production"
          New-Item -ItemType Directory -Path $productionDir -Force | Out-Null
          Copy-Item -LiteralPath (Join-Path $targetDir "debug/chadex-windows.exe") -Destination $productionDir
          Copy-Item -LiteralPath (Join-Path $targetDir "debug/helper") -Destination $productionDir -Recurse
          Copy-Item -LiteralPath (Join-Path $targetDir "debug/chadex-runtime") -Destination $productionDir -Recurse
          Invoke-NativeChecked -FilePath "cargo" -Arguments @(
            "test", "--locked", "--manifest-path", $tauriManifest,
            "--features", "custom-protocol,desktop-smoke"
          )
          Invoke-NativeChecked -FilePath "cargo" -Arguments @(
            "build", "--locked", "--manifest-path", $tauriManifest,
            "--features", "custom-protocol,desktop-smoke"
          )

          $appPath = Join-Path $targetDir "debug/chadex-windows.exe"
          $reportPath = Join-Path $env:RUNNER_TEMP "windows-desktop-smoke.json"
          Invoke-NativeChecked -FilePath "python" -Arguments @(
            "scripts/windows_desktop_smoke.py", "--app", $appPath, "--output", $reportPath
          )

      - name: Upload Windows desktop W3 report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-w3-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-desktop-smoke.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows desktop smoke-feature debug build and resources
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-w3-smoke-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            runtime-engine/target/debug/chadex-windows.exe
            runtime-engine/target/debug/helper/
            runtime-engine/target/debug/chadex-runtime/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Windows desktop without smoke IPC
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-desktop-w3-production-debug-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-desktop-production/
          if-no-files-found: warn
          retention-days: 7

  windows-release:
    name: Windows W5 installer candidate
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0

      - name: Install pinned Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust installation failed." }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust selection failed." }

      - name: Validate release tooling
        shell: pwsh
        run: |
          python -B scripts/test_prepare_windows_release.py
          if ($LASTEXITCODE -ne 0) { throw "Release staging regression failed." }
          python -B scripts/test_windows_installer_smoke.py
          if ($LASTEXITCODE -ne 0) { throw "Installer harness regression failed." }
          python -B scripts/test_windows_suspended_launch.py
          if ($LASTEXITCODE -ne 0) { throw "Suspended ownership regression failed." }
          node --test scripts/windows_installed_probe.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Installed probe regression failed." }

      - name: Build unsigned release candidate and synthetic upgrade fixture
        shell: pwsh
        run: |
          .\scripts\build_windows_release.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP "windows-w5-candidate") -BuildUpgradeFixture

      - name: Install, upgrade, relaunch, reinstall and uninstall production candidate
        shell: pwsh
        run: |
          python -B scripts/windows_installer_smoke.py --candidate-dir (Join-Path $env:RUNNER_TEMP "windows-w5-candidate") --output (Join-Path $env:RUNNER_TEMP "windows-w5-installer.json")
          if ($LASTEXITCODE -ne 0) { throw "Installed production acceptance failed." }

      - name: Upload sanitized W5 installer report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-w5-installer-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/windows-w5-installer.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload tested unsigned installer candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-w5-unsigned-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/windows-w5-candidate/*unsigned-setup.exe
            ${{ runner.temp }}/windows-w5-candidate/*.sha256
            ${{ runner.temp }}/windows-w5-candidate/candidate.json
            ${{ runner.temp }}/windows-w5-candidate/release-resources.json
          if-no-files-found: error
          retention-days: 14

  arm64-package:
    name: ARM64 package gate
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Rust
        run: ./scripts/bootstrap_rust.sh

      - name: Build hardened-runtime ad-hoc package
        env:
          CHADEX_APP_OUTPUT: ${{ runner.temp }}/Chadex.app
          CHADEX_CODESIGN_MODE: adhoc
          CHADEX_RUNTIME_PROFILE: release
        run: ./scripts/build_app.sh

      - name: Verify package shape
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Chadex.app"
          plutil -lint "$app/Contents/Info.plist"
          codesign --verify --deep --strict "$app"
          codesign -dvvv "$app" 2>&1 | grep -q 'flags=.*runtime'
          for executable in \
            "$app/Contents/MacOS/Chadex" \
            "$app/Contents/Helpers/chadex-helper" \
            "$app/Contents/Resources/chadex-runtime/chadex-runtime-cli" \
            "$app/Contents/Resources/chadex-runtime/chadex-runtime-server" \
            "$app/Contents/Resources/chadex-runtime/chadex-runtime-runner"
          do
            test "$(lipo -archs "$executable")" = "arm64"
            codesign --verify --strict "$executable"
            codesign -dvvv "$executable" 2>&1 | grep -q 'flags=.*runtime'
          done
