name: Free Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag label, for example v0.2.3"
        required: true
        type: string
      app_version:
        description: "CFBundleShortVersionString, for example 0.2.3"
        required: true
        type: string
      build_number:
        description: "CFBundleVersion; leave empty to use the Actions run number"
        required: false
        type: string

permissions:
  contents: write

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
      dmg_name: ${{ steps.release.outputs.dmg_name }}
      artifact_name: ${{ steps.release.outputs.artifact_name }}
      windows_artifact_name: ${{ steps.release.outputs.windows_artifact_name }}
      windows_installer_name: ${{ steps.release.outputs.windows_installer_name }}
    env:
      INPUT_TAG: ${{ inputs.tag }}
      INPUT_APP_VERSION: ${{ inputs.app_version }}
      INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
          fi
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "error: tag must be vMAJOR.MINOR.PATCH with an optional safe prerelease suffix" >&2; exit 1;
          }
          tag_version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="$tag_version"
          else
            version="$INPUT_APP_VERSION"
            [[ "$version" == "$tag_version" ]] || {
              echo "error: app_version must match the version encoded in tag" >&2; exit 1;
            }
          fi
          build="${INPUT_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$build" =~ ^[0-9]+(\.[0-9]+)*$ ]]
          dmg_name="Chadex-${tag}-macos-arm64.dmg"
          artifact_name="Chadex-${tag}-macos-arm64"
          windows_artifact_name="Chadex-${tag}-windows-x64"
          windows_installer_name="Chadex-${version}-windows-x64-unsigned-setup.exe"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "app_version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$dmg_name" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "windows_artifact_name=$windows_artifact_name" >> "$GITHUB_OUTPUT"
          echo "windows_installer_name=$windows_installer_name" >> "$GITHUB_OUTPUT"

  public-history:
    name: Public history / secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.29.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl -fsSL "$url" -o "$RUNNER_TEMP/$archive"
          echo "e4eb209d04e20339d77122a3bdf9cd41351255cfb27ebcb75e85325e04f88924  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "GITLEAKS_BIN=$RUNNER_TEMP/gitleaks/gitleaks" >> "$GITHUB_ENV"

      - name: Public history gate
        env:
          CHADEX_REQUIRE_GITLEAKS: "1"
        run: ./scripts/public_release_check.sh HEAD

  source-gate:
    name: Source release gate
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Rust
        run: ./scripts/bootstrap_rust.sh

      - name: Source release gate
        env:
          CHADEX_RELEASE_CHECK_BUILD_APP: "0"
        run: ./scripts/release_check.sh

  build-package:
    name: Build free ARM64 DMG
    needs: metadata
    runs-on: macos-26
    timeout-minutes: 75
    env:
      CHADEX_APP_VERSION: ${{ needs.metadata.outputs.app_version }}
      CHADEX_APP_BUILD_NUMBER: ${{ needs.metadata.outputs.build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bootstrap pinned Rust
        run: ./scripts/bootstrap_rust.sh

      - name: Build ad-hoc signed app
        env:
          CHADEX_APP_OUTPUT: ${{ runner.temp }}/Chadex.app
          CHADEX_CODESIGN_MODE: adhoc
          CHADEX_RUNTIME_PROFILE: release
        run: ./scripts/build_app.sh

      - name: Require a macOS 26+ SDK
        env:
          CHADEX_APP_OUTPUT: ${{ runner.temp }}/Chadex.app
        run: |
          # Apps linked against an older SDK run in compatibility mode on
          # macOS 26+: no Liquid Glass, old button shapes.
          sdk=$(otool -l "$CHADEX_APP_OUTPUT/Contents/MacOS/Chadex" | awk '/LC_BUILD_VERSION/{f=1} f&&$1=="sdk"{print $2; exit}')
          echo "Linked SDK: $sdk"
          [ "${sdk%%.*}" -ge 26 ] || { echo "error: release app must link a macOS 26+ SDK (got $sdk)" >&2; exit 1; }

      - name: Package and smoke-test DMG
        env:
          CHADEX_APP_OUTPUT: ${{ runner.temp }}/Chadex.app
          CHADEX_DMG_OUTPUT: ${{ runner.temp }}/${{ needs.metadata.outputs.dmg_name }}
        run: ./scripts/package_free_macos_release.sh "$CHADEX_APP_OUTPUT" "$CHADEX_DMG_OUTPUT"

      - name: Upload free release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/${{ needs.metadata.outputs.dmg_name }}
            ${{ runner.temp }}/${{ needs.metadata.outputs.dmg_name }}.sha256
          if-no-files-found: error

  windows-package:
    name: Build Windows installer and signed updater
    needs:
      - metadata
      - public-history
      - source-gate
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json

      - name: Install pinned Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust installation failed." }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { throw "Pinned Rust selection failed." }

      - name: Build signed Windows release assets
        shell: pwsh
        env:
          CHADEX_RELEASE_VERSION: ${{ needs.metadata.outputs.app_version }}
          CHADEX_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          CHADEX_UPDATER_PUBLIC_KEY: ${{ vars.CHADEX_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          .\scripts\build_windows_release.ps1 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "windows-release") `
            -Version $env:CHADEX_RELEASE_VERSION `
            -ReleaseTag $env:CHADEX_RELEASE_TAG `
            -EnableUpdater

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ needs.metadata.outputs.windows_artifact_name }}
          path: |
            ${{ runner.temp }}/windows-release/${{ needs.metadata.outputs.windows_installer_name }}
            ${{ runner.temp }}/windows-release/${{ needs.metadata.outputs.windows_installer_name }}.sha256
            ${{ runner.temp }}/windows-release/${{ needs.metadata.outputs.windows_installer_name }}.sig
            ${{ runner.temp }}/windows-release/latest.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs:
      - metadata
      - public-history
      - source-gate
      - build-package
      - windows-package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/release

      - name: Download Windows release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.metadata.outputs.windows_artifact_name }}
          path: ${{ runner.temp }}/release/windows

      - name: Publish GitHub prerelease/release
        env:
          GH_TOKEN: "${{ github.token }}"
          CHADEX_RELEASE_TAG: ${{ needs.metadata.outputs.release_tag }}
          CHADEX_DMG_OUTPUT: ${{ runner.temp }}/release/${{ needs.metadata.outputs.dmg_name }}
          CHADEX_WINDOWS_INSTALLER: ${{ runner.temp }}/release/windows/${{ needs.metadata.outputs.windows_installer_name }}
          CHADEX_WINDOWS_LATEST: ${{ runner.temp }}/release/windows/latest.json
        shell: bash
        run: |
          set -euo pipefail
          notes_file="docs/releases/${CHADEX_RELEASE_TAG#v}.md"
          test -f "$notes_file"
          test -f "$CHADEX_DMG_OUTPUT"
          test -f "$CHADEX_DMG_OUTPUT.sha256"
          test -f "$CHADEX_WINDOWS_INSTALLER"
          test -f "$CHADEX_WINDOWS_INSTALLER.sha256"
          test -f "$CHADEX_WINDOWS_INSTALLER.sig"
          test -f "$CHADEX_WINDOWS_LATEST"
          args=(release create "$CHADEX_RELEASE_TAG" "$CHADEX_DMG_OUTPUT" "$CHADEX_DMG_OUTPUT.sha256" "$CHADEX_WINDOWS_INSTALLER" "$CHADEX_WINDOWS_INSTALLER.sha256" "$CHADEX_WINDOWS_INSTALLER.sig" "$CHADEX_WINDOWS_LATEST" --title "Chadex $CHADEX_RELEASE_TAG" --notes-file "$notes_file")
          [[ "$CHADEX_RELEASE_TAG" != *-* ]] || args+=(--prerelease)
          gh "${args[@]}"
